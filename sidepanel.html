<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Assistant</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="spark" viewBox="0 0 24 24"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#4f7bff"/></linearGradient></defs><path fill="url(#g)" d="M12 1c.6 5.6 4.4 9.4 11 11-6.6 1.6-10.4 5.4-11 11-.6-5.6-4.4-9.4-11-11 6.6-1.6 10.4-5.4 11-11z"/></svg>
    <span>AI Assistant</span>
  </div>
  <div class="bar">
    <button id="newBtn" class="outline"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New Conversation</button>
    <div class="seg">
      <button data-tab="chat" class="on"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>Chat</button>
      <button data-tab="db"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg>Database</button>
    </div>
  </div>
</header>

<main id="chat" class="view">
  <div class="chathead">
    <span id="convTitle">New conversation</span>
    <span id="engine" class="engine"></span>
    <button id="ongoingBtn" class="chip">Ongoing (0) ▾</button>
    <div id="ongoingList" class="drawer hidden"></div>
  </div>
  <div id="banner" class="banner hidden">Conversation is full: save it or start a new one</div>
  <div id="thread" class="thread"></div>
  <footer class="composer">
    <textarea id="input" rows="1" placeholder="Type a message..."></textarea>
    <button id="saveBtn" class="outline plain"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Save</button>
    <button id="sendBtn" class="primary"><svg viewBox="0 0 24 24"><path d="M21 3 10 14M21 3l-7 18-4-7-7-4z"/></svg>Enter</button>
  </footer>
</main>

<main id="db" class="view hidden">
  <div class="dbhead">
    <svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg>
    <h2>Saved Notes</h2><span id="count" class="badge">0</span>
  </div>
  <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="search" placeholder="Search your notes..."></label>
  <div id="cards" class="cards"></div>
</main>

<div id="toast" class="toast"></div>

<script src="panel-bridge.js"></script>
<script src="export.js"></script>
<script src="sidepanel.js"></script>
</body>
</html>
